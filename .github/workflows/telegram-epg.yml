name: Telegram EPG Update

on:
  schedule:
    # Jam 00:30 WIB = 17:30 UTC (hari sebelumnya)
    - cron: '30 17 * * *'
  workflow_dispatch:
    inputs:
      channels:
        description: 'Slug channel dipisah koma (mis. hbo,nickelodeon). Kosongkan = semua channel.'
        required: false
        type: string
        default: ''

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'


      - name: Send schedule to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNELS: ${{ inputs.channels }}
        run: node .github/telegram-update.mjs
