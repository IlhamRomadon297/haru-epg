name: Telegram EPG Update

on:
  schedule:
    # Jam 00:30 WIB = 17:30 UTC (hari sebelumnya)
    - cron: '30 17 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Find chat IDs (diagnostic)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node .github/find-chat-id.mjs

      - name: Send schedule to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node .github/telegram-update.mjs
